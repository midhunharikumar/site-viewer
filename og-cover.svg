<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1419"/>
      <stop offset="1" stop-color="#1a2330"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a9850"/>
      <stop offset=".2" stop-color="#91cf60"/>
      <stop offset=".4" stop-color="#d9ef8b"/>
      <stop offset=".6" stop-color="#fee08b"/>
      <stop offset=".75" stop-color="#fc8d59"/>
      <stop offset=".9" stop-color="#d73027"/>
      <stop offset="1" stop-color="#7a0177"/>
    </linearGradient>
    <radialGradient id="dotG" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- decorative dots = locality markers -->
  <g opacity=".95">
    <circle cx="220" cy="180" r="13" fill="#1a9850"/>
    <circle cx="320" cy="220" r="16" fill="#91cf60"/>
    <circle cx="420" cy="155" r="18" fill="#fee08b"/>
    <circle cx="540" cy="240" r="22" fill="#fc8d59"/>
    <circle cx="660" cy="170" r="14" fill="#d73027"/>
    <circle cx="780" cy="240" r="19" fill="#7a0177"/>
    <circle cx="270" cy="350" r="15" fill="#fee08b"/>
    <circle cx="390" cy="400" r="20" fill="#fc8d59"/>
    <circle cx="510" cy="330" r="17" fill="#d9ef8b"/>
    <circle cx="630" cy="380" r="24" fill="#d73027"/>
    <circle cx="750" cy="320" r="15" fill="#fc8d59"/>
    <circle cx="870" cy="380" r="18" fill="#fee08b"/>
    <circle cx="220" cy="490" r="14" fill="#91cf60"/>
    <circle cx="340" cy="510" r="16" fill="#1a9850"/>
    <circle cx="460" cy="470" r="20" fill="#d9ef8b"/>
    <circle cx="580" cy="510" r="14" fill="#fee08b"/>
    <circle cx="700" cy="480" r="18" fill="#fc8d59"/>
    <circle cx="820" cy="510" r="15" fill="#91cf60"/>
    <!-- metro line accent -->
    <path d="M180,250 Q480,140 820,260 T1080,400" stroke="#4f9dff" stroke-width="4" fill="none" opacity=".55" stroke-dasharray="2 6"/>
    <path d="M150,420 Q400,500 700,420 T1100,330" stroke="#21c198" stroke-width="4" fill="none" opacity=".55"/>
  </g>
  <!-- soft vignette -->
  <rect width="1200" height="630" fill="url(#dotG)"/>
  <!-- text block -->
  <g font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#e6edf3">
    <text x="60" y="100" font-size="28" font-weight="600" fill="#4f9dff" letter-spacing="3">FLATMAP.CLOUD</text>
    <text x="60" y="175" font-size="68" font-weight="800">Bangalore</text>
    <text x="60" y="245" font-size="62" font-weight="800">property price map</text>
    <text x="60" y="305" font-size="28" fill="#8b97a7">127 localities · 168 launches · Namma Metro · 2019–2029</text>
    <!-- heat bar -->
    <rect x="60" y="535" width="500" height="14" rx="7" fill="url(#heat)"/>
    <text x="60" y="525" font-size="14" fill="#8b97a7">PRICE ₹/SQFT</text>
    <text x="60" y="572" font-size="13" fill="#8b97a7">₹4k</text>
    <text x="300" y="572" font-size="13" fill="#8b97a7">₹10k</text>
    <text x="535" y="572" font-size="13" fill="#8b97a7">₹27k+</text>
    <!-- right-side pill -->
    <g transform="translate(880,470)">
      <rect x="0" y="0" width="260" height="92" rx="14" fill="#171d26" stroke="#2a3441"/>
      <text x="20" y="32" font-size="14" fill="#8b97a7" letter-spacing="1">HEAT INDEX</text>
      <text x="20" y="68" font-size="32" font-weight="800" fill="#fee08b">Late-cycle, amber</text>
    </g>
  </g>
</svg>
